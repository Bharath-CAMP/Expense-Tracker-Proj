<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Paisa Pilot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: ink-coloured rail on the left, flat sections divided by rules (no card stack).
   The one bold element is the "left after spending" figure with its month-pace strip. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --fg: #14213d;
  --fg2: #5b6676;
  --line: #dde1e8;
  --field: #b9c0cc;
  --rail: #14213d;
  --rail-fg: #c9d1e3;
  --rail-hover: #2a3a5c;
  --btn: #14213d;
  --on-btn: #ffffff;
  --good: #0e7c66;
  --good-tint: #e3f1ed;
  --warn: #e8a317;
  --warn-text: #8a5d00;
  --bad: #b3412f;
  --bad-tint: #fbeceb;
  --info: #1f6f8b;
  --font-body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-head: 'Bricolage Grotesque', 'Instrument Sans', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1624; --surface: #172033; --fg: #e8ecf4; --fg2: #9aa6ba; --line: #2a3550; --field: #3a4766;
    --rail: #0a101c; --rail-fg: #a9b4c9; --rail-hover: #1d2a45; --btn: #e8ecf4; --on-btn: #0f1624;
    --good: #3cc6a6; --good-tint: #123029; --warn: #f0b73a; --warn-text: #f0b73a; --bad: #e8715d; --bad-tint: #3a1c18; --info: #5bb3d1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1624; --surface: #172033; --fg: #e8ecf4; --fg2: #9aa6ba; --line: #2a3550; --field: #3a4766;
  --rail: #0a101c; --rail-fg: #a9b4c9; --rail-hover: #1d2a45; --btn: #e8ecf4; --on-btn: #0f1624;
  --good: #3cc6a6; --good-tint: #123029; --warn: #f0b73a; --warn-text: #f0b73a; --bad: #e8715d; --bad-tint: #3a1c18; --info: #5bb3d1;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: auto; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--font-head); margin: 0; line-height: 1.15; text-wrap: balance; }
h1 { font-size: 1.9rem; font-weight: 700; }
h2 { font-size: 1.15rem; font-weight: 600; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
[hidden] { display: none !important; }
.num, .fig-value, .amount { font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }

/* ---- rail ---- */
.rail { background: var(--rail); color: #fff; position: sticky; top: 0; height: 100vh; }
.rail-in { display: flex; flex-direction: column; gap: 28px; height: 100%; padding: 28px 16px 24px max(16px, env(safe-area-inset-left, 0px)); }
.brand { font-family: var(--font-head); font-weight: 700; font-size: 1.35rem; padding: 0 12px; white-space: nowrap; }
.rail nav { display: flex; flex-direction: column; gap: 2px; }
.rail nav a { color: var(--rail-fg); text-decoration: none; padding: 9px 12px; border-radius: 6px; }
.rail nav a:hover { background: var(--rail-hover); color: #fff; }
.rail nav a[aria-current="page"] { background: #fff; color: #14213d; font-weight: 600; }
.rail-foot { margin-top: auto; padding: 0 12px; display: flex; flex-direction: column; gap: 6px; font-size: 0.88rem; color: var(--rail-fg); }
.rail-foot .link { color: #fff; text-align: left; }

/* ---- main ---- */
.main { min-width: 0; }
.topbar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 16px 16px 16px 32px; padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 5; }
.stepper { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 6px; padding: 2px; }
.stepper strong { min-width: 150px; text-align: center; font-weight: 600; }
.stepper button { width: 34px; height: 34px; border: 0; background: transparent; border-radius: 4px; font-size: 1.3rem; cursor: pointer; }
.stepper button:hover:not(:disabled) { background: var(--bg); }
.stepper button:disabled { opacity: .35; cursor: not-allowed; }
.page { padding: 32px 32px 72px; padding-right: max(32px, env(safe-area-inset-right, 0px)); max-width: 1180px; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 26px; }
.page-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.section { border-top: 2px solid var(--fg); padding: 18px 0 34px; min-width: 0; }
.section > h2, .section-head h2 { margin-bottom: 16px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 48px; }
.muted { color: var(--fg2); font-size: .92rem; }
.muted.over { color: var(--bad); }

/* ---- notice ---- */
.notice { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--good-tint); border-radius: 6px; padding: 10px 14px; margin-bottom: 22px; }

/* ---- hero ---- */
.hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px 56px; align-items: end; padding: 4px 0 34px; }
.hero-label { color: var(--fg2); }
.hero-amount { font-family: var(--font-head); font-weight: 700; font-size: clamp(2.8rem, 8vw, 5.4rem); line-height: 1; letter-spacing: -.02em; color: var(--good); font-variant-numeric: tabular-nums; }
.hero-amount.neg { color: var(--bad); }
.pace p { margin-bottom: 14px; }
.pace-track { position: relative; }
.pace-track .bar { height: 14px; }
.pace-marker { position: absolute; top: -6px; bottom: -6px; width: 3px; margin-left: -1px; background: var(--fg); border-radius: 2px; }

/* ---- figures ---- */
.figures { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); border-top: 2px solid var(--fg); margin-bottom: 8px; }
.fig { display: flex; flex-direction: column; gap: 2px; padding: 16px 20px 20px 0; min-width: 0; }
.fig-label { color: var(--fg2); font-size: .9rem; }
.fig-value { font-family: var(--font-head); font-weight: 600; font-size: 1.75rem; line-height: 1.2; }
.fig.good .fig-value { color: var(--good); }
.fig.bad .fig-value { color: var(--bad); }
.fig-note { color: var(--fg2); font-size: .85rem; }

/* ---- charts and lists ---- */
.chart-box { position: relative; height: 300px; }
.chart-box.sm { height: 220px; }
.chart-box.lg { height: 340px; }
.split { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 24px; align-items: center; }
ul.plain, ul.legend, ul.tx, ul.insights, ul.rows, ul.goals, ul.share { list-style: none; margin: 0; padding: 0; }
ul.legend li { display: grid; grid-template-columns: 14px 1fr auto; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
ul.tx li { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.tx-main { display: flex; flex-direction: column; min-width: 0; }
.tx-main strong { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx-main small { color: var(--fg2); }
.amount { font-weight: 600; white-space: nowrap; }
.amount.income { color: var(--good); }
.alert-line { padding: 8px 0 8px 14px; border-left: 3px solid var(--warn); margin-bottom: 8px; }
ul.share li { display: grid; grid-template-columns: 150px minmax(0, 1fr) 170px; align-items: center; gap: 14px; padding: 7px 0; }
.share-track { display: block; height: 12px; background: var(--line); border-radius: 6px; overflow: hidden; }
.share-track span { display: block; height: 100%; }
.share-val { text-align: right; }
.share-val small { color: var(--fg2); margin-left: 6px; }

.bar { height: 10px; background: var(--line); border-radius: 6px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--good); border-radius: 6px; transition: width .4s ease; }
.bar[data-s="warning"] span { background: var(--warn); }
.bar[data-s="exceeded"] span { background: var(--bad); }
.st.warning { color: var(--warn-text); }
.st.exceeded { color: var(--bad); }

.empty { border: 1px dashed var(--field); border-radius: 6px; padding: 20px; color: var(--fg2); margin-bottom: 16px; }
.empty strong { color: var(--fg); display: block; }

/* ---- controls ---- */
.btn { display: inline-block; border: 1px solid var(--btn); background: var(--surface); color: var(--fg); padding: 9px 16px; border-radius: 6px; cursor: pointer; text-decoration: none; font-weight: 500; line-height: 1.2; }
.btn:hover:not(:disabled) { background: var(--bg); }
.btn.primary { background: var(--btn); color: var(--on-btn); }
.btn.primary:hover:not(:disabled) { opacity: .88; background: var(--btn); }
.btn.small { padding: 6px 11px; font-size: .9rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.link.danger { color: var(--bad); }
.field { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 0; }
.field.narrow { max-width: 280px; }
.field label { font-weight: 500; font-size: .92rem; }
.field small { color: var(--fg2); }
input, select, textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--field); border-radius: 6px; background: var(--surface); }
input:focus, select:focus, textarea:focus { border-color: var(--fg); }
input[type="checkbox"] { width: auto; }
.row { display: flex; gap: 14px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.seg { display: inline-flex; border: 1px solid var(--btn); border-radius: 6px; overflow: hidden; align-self: flex-start; }
.seg button { border: 0; background: var(--surface); padding: 8px 18px; cursor: pointer; }
.seg button.on { background: var(--btn); color: var(--on-btn); }
.seg button:disabled { opacity: .45; cursor: not-allowed; }
label.btn { cursor: pointer; }
.small { font-size: .88rem; }
.stamp { white-space: nowrap; color: var(--fg2); font-size: .88rem; }
.pdf-end { display: grid; gap: 10px; justify-items: start; }
.filters { display: grid; grid-template-columns: 200px 170px minmax(0, 1fr) auto; gap: 12px; align-items: center; margin-bottom: 20px; }
.check { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.err { color: var(--bad); font-size: .92rem; }
.ok { color: var(--good); font-size: .92rem; }
.hint strong { color: var(--fg); }

/* ---- table ---- */
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-weight: 600; color: var(--fg2); font-size: .88rem; padding: 8px 10px; border-bottom: 2px solid var(--fg); white-space: nowrap; }
.tbl td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl .r { text-align: right; }
.tbl .acts { text-align: right; white-space: nowrap; }
.tbl .acts .link { margin-left: 12px; }
.tag { margin-left: 8px; font-size: .78rem; color: var(--good); border: 1px solid var(--good); border-radius: 10px; padding: 0 7px; }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 16px; color: var(--fg2); }

/* ---- modal ---- */
.overlay { position: fixed; inset: 0; background: rgba(8, 14, 28, .6); display: grid; place-items: center; padding: 16px; z-index: 20; }
.dialog { background: var(--surface); border-radius: 10px; width: min(520px, 100%); max-height: 92vh; overflow-y: auto; padding: 22px 24px 24px; }
.dialog-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 10px; }

/* ---- budget ---- */
.b-total { margin-bottom: 22px; }
.b-total p { margin-bottom: 8px; font-size: 1.05rem; }
ul.rows li { margin-bottom: 16px; }
.b-head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; }
.limits { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }

/* ---- insights / assistant ---- */
.insight { padding: 12px 0 12px 16px; border-left: 4px solid var(--line); margin-bottom: 14px; }
.insight p { margin-top: 2px; }
.insight[data-sev="warning"] { border-left-color: var(--warn); }
.insight[data-sev="positive"] { border-left-color: var(--good); }
.insight[data-sev="info"] { border-left-color: var(--info); }
.assistant { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 0 48px; align-items: start; }
.score { display: flex; align-items: center; gap: 18px; margin-bottom: 16px; }
.ring { --pct: 0; width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--good) calc(var(--pct) * 1%), var(--line) 0); flex: none; }
.ring strong { width: 64px; height: 64px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; font-family: var(--font-head); font-size: 1.5rem; }
.callout { background: var(--good-tint); border-radius: 6px; padding: 12px 14px; margin-bottom: 18px; }
.chat-log { display: flex; flex-direction: column; gap: 10px; max-height: 380px; overflow-y: auto; padding: 4px 2px 12px; }
.msg { max-width: 90%; padding: 10px 13px; border-radius: 10px; white-space: pre-wrap; }
.msg.bot { background: var(--surface); border: 1px solid var(--line); align-self: flex-start; }
.msg.user { background: var(--btn); color: var(--on-btn); align-self: flex-end; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 14px; }
.chip { border: 1px solid var(--field); background: var(--surface); border-radius: 16px; padding: 5px 12px; font-size: .88rem; cursor: pointer; }
.chip:hover { border-color: var(--fg); }
.chat-form { display: flex; gap: 10px; }

/* ---- goals ---- */
.goal-form { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 14px; align-items: end; }
.goal { padding: 16px 0; border-bottom: 1px solid var(--line); }
.goal-head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
.goal .muted { margin: 8px 0; }
.goal-acts { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.inline { display: flex; gap: 8px; }
.inline input { width: 150px; }
.confirm { display: inline-flex; gap: 10px; align-items: center; }

/* ---- reports ---- */
.report-title { margin-bottom: 18px; font-size: 1.5rem; }
textarea.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .82rem; min-height: 110px; resize: vertical; }

/* ---- dashboard additions ---- */
.hero { grid-template-columns: auto minmax(0, 1fr) auto; }
.health { display: flex; align-items: center; gap: 14px; }
.health > div:last-child { display: flex; flex-direction: column; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 0 24px; border-top: 2px solid var(--fg); margin-bottom: 8px; }
.kpi { display: flex; flex-direction: column; gap: 2px; padding: 16px 0 20px; min-width: 0; }
.kpi-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.kpi .fig-value { font-family: var(--font-head); font-weight: 600; font-size: 1.75rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
.kpi.good .fig-value { color: var(--good); }
.kpi.bad .fig-value { color: var(--bad); }
.kpi .fig-note { color: var(--fg2); font-size: .85rem; }
.spark { flex: none; max-width: 40%; height: auto; }
.grid-wide { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 0 48px; }
.svgbox { width: 100%; min-width: 0; overflow: hidden; }
.svgbox.center { text-align: center; }
.chart { display: block; max-width: 100%; height: auto; }
.chart .ax { fill: var(--fg2); font-size: 11px; font-family: var(--font-body); }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .zl { stroke: var(--fg2); stroke-width: 1; }
.chart .donut-bg { stroke: var(--line); }
.chart .dn-s { fill: var(--fg2); font-size: 12px; font-family: var(--font-body); }
.chart .dn-b { fill: var(--fg); font-size: 19px; font-weight: 600; font-family: var(--font-head); }
.key { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--fg2); font-size: .88rem; }
.key .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
.heat { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; max-width: 420px; margin-bottom: 12px; }
.heat .hd { text-align: center; color: var(--fg2); font-size: .78rem; }
.heat .hc { aspect-ratio: 1; display: grid; place-items: center; border-radius: 4px; background: var(--line); font-size: .78rem; font-variant-numeric: tabular-nums; }
.heat .hc.fut { opacity: .45; }
.heat .hc.on { background: var(--info); }
@supports (background: color-mix(in srgb, red 50%, blue)) { .heat .hc.on { background: color-mix(in srgb, var(--info) var(--p), var(--surface)); } }
.heat .hc.hot { color: var(--bg); }
.facts { list-style: none; margin: 0; padding: 0; }
.facts li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.facts strong { font-variant-numeric: tabular-nums; }
.facts .pos { color: var(--good); }
.facts .neg { color: var(--bad); }
.notice-acts { display: inline-flex; gap: 12px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--rail-fg); }
.pill.good { color: #7fe0c6; }
.pill.bad { color: #ffb3a6; }
.toast { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: 460px; margin: 0 auto; background: var(--fg); color: var(--bg); padding: 12px 16px; border-radius: 8px; z-index: 30; }
.dialog .callout { margin: 0; }
hr { border: 0; border-top: 1px solid var(--line); width: 100%; margin: 4px 0; }
.loading { padding: 32px 0; color: var(--fg2); }

@media (max-width: 900px) {
  .grid-wide { grid-template-columns: minmax(0, 1fr); }
  .hero { grid-template-columns: minmax(0, 1fr); }
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; height: auto; }
  .rail-in { flex-direction: row; align-items: center; gap: 14px; padding: 10px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-x: auto; }
  .brand { padding: 0; }
  .rail nav { flex-direction: row; }
  .rail nav a { white-space: nowrap; }
  .rail-foot { margin: 0 0 0 auto; padding: 0; flex-direction: row; gap: 12px; white-space: nowrap; }
  .topbar { padding-left: max(16px, env(safe-area-inset-left, 0px)); position: static; }
  .page { padding: 22px 16px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .grid-2, .assistant, .hero { grid-template-columns: minmax(0, 1fr); }
  .filters, .goal-form, .split { grid-template-columns: minmax(0, 1fr); }
  ul.share li { grid-template-columns: 110px minmax(0, 1fr); }
  .share-val { grid-column: 1 / -1; text-align: left; }
  .row { flex-direction: column; }
}
@media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }
</style>
<div class="app">
  <aside class="rail">
    <div class="rail-in">
      <div class="brand">Paisa Pilot</div>
      <nav id="nav" aria-label="Main"></nav>
      <div class="rail-foot">
        <span id="storeStatus" class="pill" role="status"></span>
        <button type="button" class="link" id="goBackup">Your data and privacy</button>
      </div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="stepper" role="group" aria-label="Choose month">
        <button type="button" id="prevM" aria-label="Previous month">&lsaquo;</button>
        <strong id="monthLabel"></strong>
        <button type="button" id="nextM" aria-label="Next month">&rsaquo;</button>
      </div>
      <button type="button" class="link" id="thisM" hidden>Back to this month</button>
    </header>
    <main class="page" id="view"></main>
  </div>
</div>
<div id="modal"></div>
<div id="toast" class="toast" role="status" hidden></div>
<script>
/* ===== Paisa Pilot: analysis engine (runs in the browser, no server) ===== */
const EXPENSE = ['Food', 'Travel', 'Shopping', 'Rent', 'Education', 'Bills', 'Entertainment', 'Health', 'Other'];
const INCOME = ['Salary', 'Allowance', 'Freelance', 'Investment', 'Other Income'];
const COLORS = { Food: '#1f6f8b', Travel: '#e8a317', Shopping: '#7a5195', Rent: '#4f6d7a', Education: '#0e7c66', Bills: '#b3412f', Entertainment: '#d4577f', Health: '#6b8e23', Other: '#8d99aa' };
const colorFor = (c) => COLORS[c] || '#8d99aa';
const FIXED = new Set(['Rent', 'Bills', 'Education']);
const FLEXIBLE = new Set(['Food', 'Travel', 'Shopping', 'Entertainment', 'Other']);
const NEEDS = new Set(['Rent', 'Bills', 'Health', 'Education', 'Food']);
const WANTS = new Set(['Travel', 'Shopping', 'Entertainment', 'Other']);

/* ---------- formatting and dates ---------- */
const nf = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 });
const money = (n) => { const v = Math.round(Number(n) || 0); return (v < 0 ? '-' : '') + '₹' + nf.format(Math.abs(v)); };
const pct = (n) => (Math.round((Number(n) || 0) * 10) / 10) + '%';
const pad = (n) => String(n).padStart(2, '0');
const isoDate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const nowDate = () => new Date();
const curMonth = () => isoDate(nowDate()).slice(0, 7);
const addMonths = (m, k) => { const [y, mo] = m.split('-').map(Number); const i = y * 12 + (mo - 1) + k; return `${Math.floor(i / 12)}-${pad((i % 12) + 1)}`; };
const monthsBetween = (a, b) => { const out = []; for (let c = a; c <= b; c = addMonths(c, 1)) out.push(c); return out; };
const daysIn = (m) => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo, 0).getDate(); };
const isPartial = (m) => m === curMonth() && nowDate().getDate() < daysIn(m);
const elapsed = (m) => (isPartial(m) ? nowDate().getDate() : daysIn(m));
const monthName = (m, short) => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo - 1, 1).toLocaleDateString('en-IN', { month: short ? 'short' : 'long', year: short ? '2-digit' : 'numeric' }); };
const stampLabel = (iso) => { const d = iso ? new Date(iso) : null; return d && !Number.isNaN(d.getTime()) ? d.toLocaleString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true }) : 'Not recorded'; };
const dateLabel = (s) => new Date(s + 'T00:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
const pctChange = (cur, prev) => (prev > 0 ? Math.round(((cur - prev) / prev) * 1000) / 10 : null);
const sum = (a) => a.reduce((s, x) => s + x, 0);
const median = (a) => { const s = [...a].sort((x, y) => x - y); const n = s.length; return n ? (n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2) : 0; };

/* ---------- queries over the transaction list ---------- */
function makeData(tx) {
  const byMonth = {};
  tx.forEach((t) => { (byMonth[t.date.slice(0, 7)] = byMonth[t.date.slice(0, 7)] || []).push(t); });
  const inMonth = (m, type) => (byMonth[m] || []).filter((t) => !type || t.type === type);
  const total = (m, type) => sum(inMonth(m, type).map((t) => t.amount));
  const byCat = (m, type = 'expense') => {
    const o = {};
    inMonth(m, type).forEach((t) => { o[t.category] = (o[t.category] || 0) + t.amount; });
    return o;
  };
  const catList = (m, type = 'expense') => Object.entries(byCat(m, type)).map(([category, t]) => ({ category, total: Math.round(t * 100) / 100 })).sort((a, b) => b.total - a.total);
  const firstExpenseMonth = () => tx.filter((t) => t.type === 'expense').map((t) => t.date.slice(0, 7)).sort()[0] || null;
  return { tx, inMonth, total, byCat, catList, firstExpenseMonth };
}

function summary(D, m) {
  const income = D.total(m, 'income'), expense = D.total(m, 'expense');
  const prevM = addMonths(m, -1);
  const categories = D.catList(m);
  return {
    month: m, income, expense, balance: income - expense,
    savingsRate: income > 0 ? Math.round(((income - expense) / income) * 1000) / 10 : 0,
    count: D.inMonth(m).length, topCategory: categories[0] || null, categories,
    expenseChange: pctChange(expense, D.total(prevM, 'expense')),
    incomeChange: pctChange(income, D.total(prevM, 'income')),
  };
}

function trend(D, m, n) {
  return monthsBetween(addMonths(m, -(n - 1)), m).map((x) => {
    const income = D.total(x, 'income'), expense = D.total(x, 'expense');
    return { month: x, income, expense, savings: income - expense };
  });
}

function budgetStatus(D, budgets, m) {
  const b = budgets[m];
  if (!b) return { hasBudget: false };
  const spent = D.byCat(m);
  const totalSpent = sum(Object.values(spent));
  const flag = (p) => (p > 100 ? 'exceeded' : p >= 80 ? 'warning' : 'ok');
  const categories = b.categoryLimits.map(({ category, limit }) => {
    const s = spent[category] || 0;
    const percent = limit > 0 ? Math.round((s / limit) * 1000) / 10 : s > 0 ? 100 : 0;
    return { category, limit, spent: s, percent, status: flag(percent) };
  });
  const totalPercent = b.totalLimit > 0 ? Math.round((totalSpent / b.totalLimit) * 1000) / 10 : 0;
  const warnings = [];
  if (totalPercent > 100) warnings.push(`You have exceeded your total budget for ${monthName(m)}.`);
  else if (totalPercent >= 80) warnings.push(`You have used ${totalPercent}% of your total budget for ${monthName(m)}.`);
  categories.filter((c) => c.status !== 'ok').forEach((c) =>
    warnings.push(c.status === 'exceeded' ? `${c.category} budget exceeded (${c.percent}% used).` : c.percent >= 100 ? `${c.category} budget is fully used.` : `${c.category} is at ${c.percent}% of its budget.`));
  return { hasBudget: true, totalLimit: b.totalLimit, totalSpent, totalRemaining: b.totalLimit - totalSpent, totalPercent, totalStatus: flag(totalPercent), categories, warnings };
}

};
const normText = (s) => String(s).toLowerCase().replace(/[^a-z\s]/g, ' ').replace(/\s+/g, ' ').trim();
function features(text) {
  const out = [];
  normText(text).split(' ').filter(Boolean).forEach((w) => {
    out.push('w:' + w);
    const p = ` ${w} `;
    for (let i = 0; i + 3 <= p.length; i += 1) out.push('c:' + p.slice(i, i + 3));
  });
  return out;
}
let modelCache = { key: '', model: null };
function buildModel(examples) {
  const counts = {}, totals = {}, docs = {}, vocab = new Set();
  EXPENSE.forEach((c) => { counts[c] = {}; totals[c] = 0; docs[c] = 0; });
  const add = (text, cat, weight) => {
    if (!counts[cat]) return;
    docs[cat] += weight;
    features(text).forEach((f) => { counts[cat][f] = (counts[cat][f] || 0) + weight; totals[cat] += weight; vocab.add(f); });
  };
  EXPENSE.forEach((c) => (SEED[c] || []).forEach((t) => add(t, c, 1)));
  examples.forEach((e) => add(e.description, e.category, 3)); // the user's own history counts more
  return { counts, totals, docs, V: vocab.size };
}
function categorize(description, examples) {
  const text = normText(description);
  if (!text) return { category: 'Other', confidence: 0, lowConfidence: true, alternatives: [] };
  const key = examples.length + ':' + (examples[0] ? examples[0].description + examples[0].category : '');
  if (modelCache.key !== key) modelCache = { key, model: buildModel(examples) };
  const m = modelCache.model;
  const feats = features(text);
  const totalDocs = sum(Object.values(m.docs));
  const scores = EXPENSE.map((c) => {
    let lp = Math.log((m.docs[c] + 1) / (totalDocs + EXPENSE.length));
    feats.forEach((f) => { lp += Math.log(((m.counts[c][f] || 0) + 0.5) / (m.totals[c] + 0.5 * m.V)); });
    return lp;
  });
  const T = Math.max(1, feats.length / 4); // temper the score so confidence is not always near 100%
  const mx = Math.max(...scores);
  const exps = scores.map((s) => Math.exp((s - mx) / T));
  const z = sum(exps);
  const ranked = EXPENSE.map((c, i) => ({ category: c, confidence: Math.round((exps[i] / z) * 1000) / 1000 })).sort((a, b) => b.confidence - a.confidence);
  return { category: ranked[0].category, confidence: ranked[0].confidence, lowConfidence: ranked[0].confidence < 0.35, alternatives: ranked.slice(1, 3) };
}

/* ---------- forecast ---------- */
function predictSeries(v) {
  const n = v.length;
  if (n === 0) return 0;
  if (n === 1) return v[0];
  if (n === 2) return (v[0] + v[1]) / 2;
  const xm = (n - 1) / 2, ym = sum(v) / n;
  let num = 0, den = 0;
  v.forEach((y, x) => { num += (x - xm) * (y - ym); den += (x - xm) ** 2; });
  const slope = den ? num / den : 0;
  const linear = ym + slope * (n - xm);
  const recent = sum(v.slice(-3)) / Math.min(3, n);
  return Math.min(Math.max(0.5 * linear + 0.5 * recent, 0), 1.5 * Math.max(...v));
}
function forecast(D, m) {
  const first = D.firstExpenseMonth();
  if (!first) return { available: false, message: 'Add some expenses to see a forecast.' };
  const lastComplete = isPartial(m) ? addMonths(m, -1) : m;
  if (lastComplete < first) return { available: false, message: 'Not enough completed months of data yet.' };
  const history = monthsBetween(first, lastComplete).slice(-6);
  const cats = new Set();
  history.forEach((h) => Object.keys(D.byCat(h)).forEach((c) => cats.add(c)));
  const categories = [...cats].map((category) => {
    const values = history.map((h) => D.byCat(h)[category] || 0);
    const predicted = predictSeries(values);
    const avg = sum(values) / values.length;
    const rel = avg > 0 ? (predicted - avg) / avg : 0;
    return { category, predicted, lastMonth: values[values.length - 1], average: avg, trend: rel > 0.1 ? 'up' : rel < -0.1 ? 'down' : 'stable' };
  }).filter((c) => c.predicted > 0 || c.lastMonth > 0).sort((a, b) => b.predicted - a.predicted);
  const totalPredicted = sum(categories.map((c) => c.predicted));
  const incomes = history.slice(-3).map((h) => D.total(h, 'income'));
  const predictedIncome = sum(incomes) > 0 ? sum(incomes) / incomes.length : 0;
  const totals = history.map((h) => D.total(h, 'expense'));
  let backtest = null;
  if (totals.length >= 4 && totals[totals.length - 1] > 0) {
    const guess = predictSeries(totals.slice(0, -1)), actual = totals[totals.length - 1];
    backtest = { month: history[history.length - 1], predicted: guess, actual, errorPct: Math.round((Math.abs(guess - actual) / actual) * 1000) / 10 };
  }
  const out = {
    available: true, targetMonth: addMonths(m, 1), historyMonths: history, categories, totalPredicted, predictedIncome,
    predictedSavings: predictedIncome ? predictedIncome - totalPredicted : null,
    confidence: history.length < 3 ? 'low' : history.length < 5 ? 'medium' : 'good', backtest,
  };
  if (isPartial(m)) {
    const cur = D.byCat(m), expected = Object.fromEntries(categories.map((c) => [c.category, c.predicted]));
    const days = daysIn(m), el = Math.max(elapsed(m), 1);
    let projected = 0;
    Object.entries(cur).forEach(([c, s]) => {
      if (FIXED.has(c)) projected += Math.max(s, expected[c] || 0);
      else projected += el >= 5 ? (s / el) * days : Math.max(s, expected[c] || 0);
    });
    Object.entries(expected).forEach(([c, v]) => { if (FIXED.has(c) && !(c in cur)) projected += v; });
    out.monthEnd = { spentSoFar: sum(Object.values(cur)), projected, daysElapsed: el, daysInMonth: days };
  }
  return out;
}

/* ---------- insights ---------- */
const effective = (cat, spent, m) => (FIXED.has(cat) || !isPartial(m) || nowDate().getDate() < 7 ? spent : (spent / nowDate().getDate()) * daysIn(m));
const ins = (type, severity, title, message, category, impact) => ({ type, severity, title, message, category, impact });

function anomalies(D, m) {
  const exp = D.tx.filter((t) => t.type === 'expense');
  const window = exp.filter((t) => [m, addMonths(m, -1)].includes(t.date.slice(0, 7)));
  const found = [];
  EXPENSE.filter((c) => !FIXED.has(c)).forEach((cat) => {
    const all = exp.filter((t) => t.category === cat).map((t) => t.amount);
    if (all.length < 6) return;
    const med = median(all), mad = median(all.map((a) => Math.abs(a - med)));
    const scale = Math.max(1.4826 * mad, 0.1 * med, 1);
    window.filter((t) => t.category === cat).forEach((t) => {
      const z = (t.amount - med) / scale;
      if (z >= 3.5 && t.amount >= 1.8 * med) found.push({ date: t.date, category: cat, description: t.description, amount: t.amount, typical: med, score: Math.round(z * 10) / 10 });
    });
  });
  return found.sort((a, b) => b.score - a.score).slice(0, 5);
}

function patterns(D, m) {
  const win = monthsBetween(addMonths(m, -2), m);
  const rows = D.tx.filter((t) => t.type === 'expense' && win.includes(t.date.slice(0, 7)));
  const byDay = Array(7).fill(0);
  let firstHalf = 0;
  rows.forEach((t) => { byDay[(new Date(t.date + 'T00:00:00').getDay() + 6) % 7] += t.amount; if (Number(t.date.slice(8)) <= 15) firstHalf += t.amount; });
  const tot = sum(byDay);
  const tm = monthsBetween(addMonths(m, -5), m);
  const categoryTrends = EXPENSE.map((category) => ({ category, values: tm.map((x) => D.byCat(x)[category] || 0) })).filter((t) => sum(t.values) > 0).sort((a, b) => sum(b.values) - sum(a.values));
  return {
    weekdaySpending: byDay.map((total, i) => ({ day: WEEKDAYS[i].slice(0, 3), total })),
    topWeekday: tot ? WEEKDAYS[byDay.indexOf(Math.max(...byDay))] : null,
    weekendShare: tot ? Math.round(((byDay[5] + byDay[6]) / tot) * 1000) / 10 : 0,
    firstHalfShare: tot ? Math.round((firstHalf / tot) * 1000) / 10 : 0,
    averageDailySpend: D.total(m, 'expense') / Math.max(elapsed(m), 1),
    months: tm, categoryTrends,
  };
}

function analyze(D, budgets, m) {
  const exp = D.tx.filter((t) => t.type === 'expense');
  if (!exp.length) return { available: false, message: 'Add some expenses to get insights.', insights: [] };
  const prevM = addMonths(m, -1);
  const cur = D.byCat(m), prev = D.byCat(prevM);
  const histMonths = monthsBetween(addMonths(m, -5), prevM).filter((x) => D.inMonth(x, 'expense').length);
  const histAvg = {};
  if (histMonths.length >= 2) EXPENSE.forEach((c) => { histAvg[c] = sum(histMonths.map((x) => D.byCat(x)[c] || 0)) / histMonths.length; });
  const partial = isPartial(m), out = [];
  let potential = 0;

  Object.entries(cur).forEach(([cat, spent]) => {
    if (cat === 'Rent') return;
    const eff = effective(cat, spent, m), p = prev[cat] || 0, change = pctChange(eff, p);
    const label = partial && eff !== spent ? 'is on track to be' : 'is';
    if (change !== null && change >= 20 && eff - p >= 300) out.push(ins('increase', 'warning', `${cat} spending is rising`, `Your ${cat.toLowerCase()} spending ${label} ${Math.round(change)}% higher than last month (${money(eff)} vs ${money(p)}). ${TIPS[cat] || ''}`.trim(), cat, eff - p));
    else if (change !== null && change <= -25 && p - eff >= 300) out.push(ins('decrease', 'positive', `${cat} spending is down`, `Nice work: ${cat.toLowerCase()} spending dropped ${Math.abs(Math.round(change))}% compared with last month (${money(eff)} vs ${money(p)}).`, cat, p - eff));
    else if (histAvg[cat] && eff > 1.3 * histAvg[cat] && eff - histAvg[cat] >= 300) out.push(ins('above-average', 'info', `${cat} is above your usual`, `${cat} spending ${label} ${money(eff)}, about ${Math.round(pctChange(eff, histAvg[cat]))}% above your usual ${money(histAvg[cat])} a month. ${TIPS[cat] || ''}`.trim(), cat, eff - histAvg[cat]));
    if (FLEXIBLE.has(cat) && histAvg[cat] !== undefined) potential += Math.max(eff - histAvg[cat], 0);
  });

  let budgetRatio = null;
  const b = budgets[m];
  if (b && b.totalLimit) {
    const effTotal = sum(Object.entries(cur).map(([c, s]) => effective(c, s, m)));
    const spentTotal = sum(Object.values(cur));
    budgetRatio = effTotal / b.totalLimit;
    if (spentTotal > b.totalLimit) out.push(ins('budget', 'warning', 'Total budget exceeded', `You have spent ${money(spentTotal)} against a budget of ${money(b.totalLimit)} (${money(spentTotal - b.totalLimit)} over).`, null, spentTotal - b.totalLimit));
    else if (partial && nowDate().getDate() >= 7 && effTotal > b.totalLimit) out.push(ins('budget', 'warning', 'On track to exceed your budget', `At the current pace you will spend about ${money(effTotal)} this month, above your ${money(b.totalLimit)} budget.`, null, effTotal - b.totalLimit));
    else if (spentTotal >= 0.8 * b.totalLimit) out.push(ins('budget', 'warning', 'Budget almost used', `You have used ${Math.round((spentTotal / b.totalLimit) * 100)}% of your monthly budget.`));
    b.categoryLimits.forEach(({ category, limit }) => {
      if (limit <= 0) return;
      const s = cur[category] || 0, eff = effective(category, s, m);
      if (s > limit) out.push(ins('budget', 'warning', `${category} budget exceeded`, `${category} is ${money(s - limit)} over its ${money(limit)} limit. ${TIPS[category] || ''}`.trim(), category, s - limit));
      else if (partial && nowDate().getDate() >= 7 && eff > limit) out.push(ins('budget', 'warning', `${category} may exceed its budget`, `At this pace ${category.toLowerCase()} will reach about ${money(eff)} against a ${money(limit)} limit.`, category, eff - limit));
    });
  }

  const an = anomalies(D, m);
  an.slice(0, 2).forEach((a) => out.push(ins('anomaly', 'info', 'Unusually large expense', `${money(a.amount)} on ${a.date} (${a.description || a.category}) is far above your typical ${a.category.toLowerCase()} purchase of ${money(a.typical)}.`, a.category, a.amount - a.typical)));

  const incomeCur = D.total(m, 'income'), expenseCur = sum(Object.values(cur));
  let savingsRate = null;
  if (incomeCur > 0) {
    savingsRate = ((incomeCur - expenseCur) / incomeCur) * 100;
    if (savingsRate < 0) out.push(ins('savings', 'warning', 'Spending exceeds income', `You have spent ${money(expenseCur - incomeCur)} more than you earned this month.`));
    else if (savingsRate < 10) out.push(ins('savings', 'warning', 'Low savings rate', `You are saving ${Math.round(savingsRate)}% of your income. A common target is 20%, which would be ${money(incomeCur * 0.2)} a month.`));
    else if (savingsRate >= 20) out.push(ins('savings', 'positive', 'Healthy savings rate', `You are saving ${Math.round(savingsRate)}% of your income. Keep it up.`));
  } else if (!partial) out.push(ins('savings', 'info', 'No income recorded', 'Add your income for this month to see your savings rate.'));

  const food = D.inMonth(m, 'expense').filter((t) => t.category === 'Food');
  if (food.length >= 10) { const save = sum(food.map((t) => t.amount)) * 0.15; out.push(ins('habit', 'info', 'Many small food purchases', `You made ${food.length} food transactions averaging ${money(sum(food.map((t) => t.amount)) / food.length)}. Planning meals could save roughly ${money(save)} a month.`, 'Food', save)); }

  const pat = patterns(D, m);
  if (pat.weekendShare >= 45) out.push(ins('pattern', 'info', 'Weekend-heavy spending', `${Math.round(pat.weekendShare)}% of your recent spending happens on weekends. Setting a weekend limit can help.`));

  const complete = monthsBetween(addMonths(m, -5), m).filter((x) => D.inMonth(x, 'expense').length && !isPartial(x)).map((x) => D.total(x, 'expense'));
  const needs = sum(Object.entries(cur).filter(([c]) => NEEDS.has(c)).map(([, v]) => v));
  const wants = sum(Object.entries(cur).filter(([c]) => WANTS.has(c)).map(([, v]) => v));
  const base = Math.max(incomeCur, expenseCur, 1);
  const order = { warning: 0, info: 1, positive: 2 };
  out.sort((a, b) => order[a.severity] - order[b.severity] || (b.impact || 0) - (a.impact || 0));

  // money-health score: 50 savings + 30 budget + 20 steadiness
  const sPts = savingsRate !== null ? 50 * Math.min(Math.max(savingsRate, 0) / 20, 1) : 0;
  const bPts = budgetRatio === null ? 15 : budgetRatio <= 1 ? 30 : 30 * Math.max(0, 1 - (budgetRatio - 1) * 2);
  let cPts = 10;
  if (complete.length >= 3) { const mean = sum(complete) / complete.length; const sd = Math.sqrt(sum(complete.map((x) => (x - mean) ** 2)) / complete.length); cPts = 20 * (1 - Math.min(mean ? sd / mean : 1, 1)); }
  const score = Math.round(sPts + bPts + cPts);
  return {
    available: true, insights: out, anomalies: an, patterns: pat, potentialMonthlySavings: potential,
    healthScore: { score, label: score >= 75 ? 'Excellent' : score >= 50 ? 'Good' : score >= 30 ? 'Needs attention' : 'At risk', components: { savings: Math.round(sPts * 10) / 10, budget: Math.round(bPts * 10) / 10, consistency: Math.round(cPts * 10) / 10 } },
    split: { needs: Math.round((needs / base) * 1000) / 10, wants: Math.round((wants / base) * 1000) / 10, savings: incomeCur ? Math.round((Math.max(incomeCur - expenseCur, 0) / base) * 1000) / 10 : 0 },
  };
}

function recommendBudget(D, m) {
  const first = D.firstExpenseMonth();
  if (!first) return { available: false, message: 'Add some expenses first so a budget can be suggested.' };
  const lastComplete = isPartial(m) ? addMonths(m, -1) : m;
  let months = monthsBetween(addMonths(lastComplete, -2), lastComplete).filter((x) => D.inMonth(x, 'expense').length);
  if (!months.length) months = [m];
  const avg = {};
  EXPENSE.forEach((c) => { const v = sum(months.map((x) => D.byCat(x)[c] || 0)) / months.length; if (v > 0) avg[c] = v; });
  const income = sum(months.map((x) => D.total(x, 'income'))) / months.length;
  const fixed = {}, flex = {};
  Object.entries(avg).forEach(([c, v]) => { (FIXED.has(c) || c === 'Health' ? fixed : flex)[c] = v; });
  const fixedTotal = sum(Object.values(fixed)), flexTotal = sum(Object.values(flex));
  const notes = [];
  let scale;
  if (income > 0) {
    const room = income * 0.8 - fixedTotal;
    if (flexTotal <= Math.max(room, 0)) scale = 1;
    else { scale = flexTotal ? Math.max(room / flexTotal, 0.6) : 1; notes.push('Flexible categories were trimmed so you can save about 20% of your income.'); }
    if (fixedTotal > income * 0.8) notes.push('Fixed costs alone exceed 80% of your income, so a 20% savings target is hard to reach.');
  } else { scale = 0.95; notes.push('No income found, so limits are about 5% below your recent average spending.'); }
  const r50 = (x) => Math.round(x / 50) * 50;
  const limits = {};
  Object.entries(fixed).forEach(([c, v]) => { limits[c] = r50(v); });
  Object.entries(flex).forEach(([c, v]) => { limits[c] = r50(v * scale); });
  const list = Object.entries(limits).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]).map(([category, limit]) => ({ category, limit }));
  const total = sum(list.map((l) => l.limit));
  return { available: true, basedOnMonths: months, totalLimit: total, categoryLimits: list, expectedSavings: income ? income - total : null, expectedSavingsRate: income ? Math.round(((income - total) / income) * 1000) / 10 : null, notes };
}

/* ---------- assistant: intent matching over the user's own data ---------- */
const CAT_WORDS = {
  Food: ['food', 'eating', 'groceries', 'grocery', 'restaurant', 'swiggy', 'zomato', 'dining'], Travel: ['travel', 'transport', 'commute', 'fuel', 'petrol', 'cab', 'uber', 'trip'],
  Shopping: ['shopping', 'clothes', 'purchases', 'amazon', 'flipkart'], Rent: ['rent'], Education: ['education', 'course', 'courses', 'tuition', 'books', 'college'],
  Bills: ['bills', 'bill', 'electricity', 'recharge', 'internet', 'utilities'], Entertainment: ['entertainment', 'movies', 'movie', 'netflix', 'subscriptions', 'games'],
  Health: ['health', 'medical', 'medicine', 'doctor', 'gym', 'pharmacy'], Other: ['other', 'miscellaneous', 'misc'],
};
const MONTH_NAMES = { january: 1, february: 2, march: 3, april: 4, may: 5, june: 6, july: 7, august: 8, september: 9, october: 10, november: 11, december: 12 };
const STARTERS = ['How much did I spend this month?', 'Which category has the highest expenses?', 'Am I exceeding my budget?', 'How much can I save next month?', 'How can I reduce my expenses?'];

function answer(question, D, budgets, month) {
  const q = question.toLowerCase().replace(/\s+/g, ' ').trim();
  const has = (...p) => p.some((x) => q.includes(x));
  const res = (intent, text) => ({ intent, answer: text });
  if (!D.tx.length) return res('no-data', "I don't see any transactions yet. Add some income and expenses and I can answer questions about them.");

  let target = month, label = 'this month';
  if (/\b(last|previous|prior) month\b/.test(q)) { target = addMonths(month, -1); label = 'last month'; }
  else for (const [name, num] of Object.entries(MONTH_NAMES)) {
    if (new RegExp(`\\b${name}\\b`).test(q)) { let y = Number(month.slice(0, 4)); if (num > Number(month.slice(5))) y -= 1; target = `${y}-${pad(num)}`; label = name[0].toUpperCase() + name.slice(1); break; }
  }
  const words = new Set(q.match(/[a-z]+/g) || []);
  const category = Object.keys(CAT_WORDS).find((c) => CAT_WORDS[c].some((k) => words.has(k))) || null;
  const exp = D.tx.filter((t) => t.type === 'expense');

  if (/^(hi|hello|hey|help|what can you do)[ ?!.]*$/.test(q)) return res('help', 'Hi! I can tell you how much you spent, your top categories, budget status, savings, a forecast for next month and ways to cut costs. Try one of the questions below.');
  if (has('how much can i save', 'can i save', 'saving potential')) {
    const f = forecast(D, month);
    if (f.available && f.predictedSavings !== null) return res('save-forecast', `Based on your history you could save around ${money(f.predictedSavings)} in ${monthName(f.targetMonth)} if you keep spending as usual.`);
    return res('save-forecast', `So far you have kept ${money(D.total(target, 'income') - D.total(target, 'expense'))} of your income for ${label}.`);
  }
  if (has('next month', 'predict', 'forecast', 'expect', 'will i spend')) {
    const f = forecast(D, month);
    if (!f.available) return res('forecast', f.message);
    let t = `I expect you to spend about ${money(f.totalPredicted)} in ${monthName(f.targetMonth)}.`;
    if (f.predictedIncome) t += ` With an income near ${money(f.predictedIncome)}, you could save about ${money(f.predictedSavings)}.`;
    if (f.categories.length) t += ` The largest category should be ${f.categories[0].category} at around ${money(f.categories[0].predicted)}.`;
    return res('forecast', t + ` (Confidence: ${f.confidence}, based on ${f.historyMonths.length} month(s) of history.)`);
  }
  if (has('reduce', 'cut', 'save money', 'saving tips', 'suggest', 'advice', 'tips', 'improve', 'how can i save', 'how to save')) {
    const info = analyze(D, budgets, month);
    const tips = (info.insights || []).filter((i) => i.severity !== 'positive').slice(0, 3);
    if (!tips.length) return res('tips', 'Your spending looks well balanced right now. Keep tracking and I will flag anything unusual.');
    return res('tips', tips.map((t, i) => `${i + 1}. ${t.message}`).join(' ') + (info.potentialMonthlySavings > 0 ? ` Cutting back to your usual levels could free up about ${money(info.potentialMonthlySavings)} a month.` : ''));
  }
  if (has('budget', 'exceed', 'overspend', 'over budget', 'limit')) {
    const b = budgets[month];
    if (!b) return res('budget', 'You have not set a budget for this month yet. Open the Budget page to create one.');
    const spent = D.total(month, 'expense'), pc = b.totalLimit ? (spent / b.totalLimit) * 100 : 0;
    let t = `You have spent ${money(spent)} of your ${money(b.totalLimit)} budget (${Math.round(pc)}%).`;
    t += spent > b.totalLimit ? ' Yes, you have exceeded your total budget.' : pc >= 80 ? ' You are close to the limit.' : ' You are within budget.';
    const cats = D.byCat(month), over = b.categoryLimits.filter((l) => l.limit > 0 && (cats[l.category] || 0) > l.limit).map((l) => `${l.category} (${money(cats[l.category] - l.limit)} over)`);
    if (over.length) t += ' Categories over limit: ' + over.join(', ') + '.';
    return res('budget', t);
  }
  if (has('compare', 'compared', 'increase', 'increased', 'more than last', 'less than last', 'vs last')) {
    const cur = D.total(month, 'expense'), prev = D.total(addMonths(month, -1), 'expense'), ch = pctChange(cur, prev);
    if (ch === null) return res('compare', `You spent ${money(cur)} this month. There is no previous month to compare with.`);
    return res('compare', `You spent ${money(cur)} this month versus ${money(prev)} last month, which is ${Math.abs(Math.round(ch))}% ${ch > 0 ? 'more' : 'less'}.`);
  }
  if (has('largest', 'biggest expense', 'biggest purchase', 'most expensive', 'top expense', 'single expense')) {
    const rows = exp.filter((t) => t.date.startsWith(target)).sort((a, b) => b.amount - a.amount).slice(0, 3);
    if (!rows.length) return res('largest', `I found no expenses for ${label}.`);
    return res('largest', `Your largest expenses for ${label}: ` + rows.map((r) => `${money(r.amount)} on ${r.category}${r.description ? ` (${r.description})` : ''}`).join('; ') + '.');
  }
  if (!category && has('highest', 'most', 'top category', 'which category', 'biggest category', 'where does my money')) {
    const list = D.catList(target);
    if (!list.length) return res('top-category', `I found no expenses for ${label}.`);
    const tot = sum(list.map((c) => c.total));
    return res('top-category', `${list[0].category} is your highest expense ${label}: ${money(list[0].total)}, about ${Math.round((list[0].total / tot) * 100)}% of your spending.` + (list[1] ? ` Next is ${list[1].category} at ${money(list[1].total)}.` : ''));
  }
  if (category && has('spend', 'spent', 'how much', 'cost', 'expense', 'on')) {
    const s = D.byCat(target)[category] || 0, p = D.byCat(addMonths(target, -1))[category] || 0, ch = pctChange(s, p);
    let t = `You spent ${money(s)} on ${category.toLowerCase()} ${label}.`;
    if (ch !== null) t += ` That is ${Math.abs(Math.round(ch))}% ${ch > 0 ? 'more' : 'less'} than the month before.`;
    if (TIPS[category] && category !== 'Rent' && ch !== null && ch > 20) t += ' ' + TIPS[category];
    return res('category-spend', t);
  }
  if (has('income', 'earn', 'salary', 'earned')) return res('income', `Your income for ${label} is ${money(D.total(target, 'income'))}.`);
  if (has('balance', 'left', 'remaining', 'saved', 'savings')) {
    const inc = D.total(target, 'income'), sp = D.total(target, 'expense');
    return res('balance', `For ${label} you earned ${money(inc)} and spent ${money(sp)}, leaving ${money(inc - sp)}.` + (inc > 0 ? ` That is a ${Math.round(((inc - sp) / inc) * 100)}% savings rate.` : ''));
  }
  if (has('spend', 'spent', 'expense', 'expenses', 'spending', 'how much')) {
    return res('total-spend', `You spent ${money(D.total(target, 'expense'))} ${label}.` + (target === month && isPartial(month) ? ` (The month is not over yet; today is day ${nowDate().getDate()}.)` : ''));
  }
  return res('unknown', "I'm not sure I understood that. I can answer questions about your spending, categories, budget, savings and next month's forecast.");
}

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
/* ===== SVG charts, drawn at the container's real width so labels stay readable on phones ===== */
const compactNf = new Intl.NumberFormat('en-IN', { notation: 'compact', maximumFractionDigits: 1 });
const tickLabel = (v) => (v === 0 ? '0' : (v < 0 ? '-' : '') + '₹' + compactNf.format(Math.abs(v)));

function scaleFor(lo, hi, count) {
  hi = Math.max(hi, 0); lo = Math.min(lo, 0);
  const span = Math.max(hi - lo, 1), raw = span / count, mag = 10 ** Math.floor(Math.log10(raw)), norm = raw / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
  const min = Math.floor(lo / step) * step, max = Math.ceil(hi / step) * step || step;
  const ticks = [];
  for (let v = min; v <= max + step / 1e6; v += step) ticks.push(Math.round(v * 1e6) / 1e6);
  return { min, max, ticks };
}

function chartGrid(w, h, L, R, T, sc, y) {
  let g = '';
  sc.ticks.forEach((t) => { g += `<line class="gl" x1="${L}" x2="${w - R}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${tickLabel(t)}</text>`; });
  if (sc.min < 0) g += `<line class="zl" x1="${L}" x2="${w - R}" y1="${y(0)}" y2="${y(0)}"/>`;
  return g;
}

function chartBars(w, h, labels, series, label) {
  const L = 46, R = 6, T = 8, B = 24, pw = w - L - R, ph = h - T - B;
  const all = series.flatMap((s) => s.values);
  const sc = scaleFor(Math.min(0, ...all), Math.max(0, ...all), 4);
  const y = (v) => T + ((sc.max - v) / (sc.max - sc.min)) * ph;
  let g = chartGrid(w, h, L, R, T, sc, y);
  const n = labels.length, bw = pw / n, skip = bw < 34 ? 2 : 1;
  const inner = Math.min(bw * 0.74, 60 * series.length), bar = inner / series.length;
  labels.forEach((lb, i) => {
    const x0 = L + i * bw + (bw - inner) / 2;
    series.forEach((s, k) => {
      const v = s.values[i] || 0, y0 = y(0), y1 = y(v);
      g += `<rect x="${(x0 + k * bar + 0.5).toFixed(1)}" y="${Math.min(y0, y1).toFixed(1)}" width="${Math.max(bar - 1, 1).toFixed(1)}" height="${Math.max(Math.abs(y0 - y1), v ? 1 : 0).toFixed(1)}" rx="2" style="fill:${s.color}"><title>${esc(lb)}, ${esc(s.name)}: ${money(v)}</title></rect>`;
    });
    if (i % skip === 0) g += `<text class="ax" x="${(L + i * bw + bw / 2).toFixed(1)}" y="${h - 6}" text-anchor="middle">${esc(lb)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(label || 'Bar chart')}">${g}</svg>`;
}

function chartLines(w, h, labels, series, label) {
  const L = 46, R = 14, T = 10, B = 24, pw = w - L - R, ph = h - T - B;
  const all = series.flatMap((s) => s.values);
  const sc = scaleFor(Math.min(0, ...all), Math.max(0, ...all), 4);
  const y = (v) => T + ((sc.max - v) / (sc.max - sc.min)) * ph;
  const n = labels.length, bw = pw / n, skip = bw < 34 ? 2 : 1;
  const x = (i) => L + (i + 0.5) * bw;
  let g = chartGrid(w, h, L, R, T, sc, y);
  labels.forEach((lb, i) => { if (i % skip === 0) g += `<text class="ax" x="${x(i).toFixed(1)}" y="${h - 6}" text-anchor="middle">${esc(lb)}</text>`; });
  series.forEach((s) => {
    const d = s.values.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
    g += `<path d="${d}" fill="none" style="stroke:${s.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? `stroke-dasharray="${s.dash}"` : ''}/>`;
    if (n <= 12) s.values.forEach((v, i) => { g += `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" style="fill:${s.color}"><title>${esc(labels[i])}, ${esc(s.name)}: ${money(v)}</title></circle>`; });
  });
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(label || 'Line chart')}">${g}</svg>`;
}

function chartDonut(size, items, topText, bottomText, label) {
  const total = sum(items.map((i) => i.value)) || 1, r = size * 0.37, sw = size * 0.17, C = 2 * Math.PI * r, c = size / 2;
  let off = 0, g = `<circle cx="${c}" cy="${c}" r="${r}" fill="none" class="donut-bg" stroke-width="${sw}"/>`;
  items.forEach((it) => {
    const len = (it.value / total) * C;
    g += `<circle cx="${c}" cy="${c}" r="${r}" fill="none" style="stroke:${it.color}" stroke-width="${sw}" stroke-dasharray="${Math.max(len - (items.length > 1 ? 1.5 : 0), 0.1).toFixed(2)} ${(C - len + (items.length > 1 ? 1.5 : 0)).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${c} ${c})"><title>${esc(it.label)}: ${money(it.value)} (${Math.round((it.value / total) * 100)}%)</title></circle>`;
    off += len;
  });
  g += `<text class="dn-s" x="${c}" y="${c - 4}" text-anchor="middle">${esc(topText || '')}</text><text class="dn-b" x="${c}" y="${c + 18}" text-anchor="middle">${esc(bottomText || '')}</text>`;
  return `<svg class="chart donut" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="${esc(label || 'Donut chart')}">${g}</svg>`;
}

function sparkline(values, color, w = 104, h = 32) {
  const n = values.length, mn = Math.min(...values), mx = Math.max(...values), span = mx - mn || 1;
  const pts = values.map((v, i) => [2 + (i * (w - 4)) / Math.max(n - 1, 1), h - 4 - ((v - mn) / span) * (h - 8)]);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join('');
  const last = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><path d="${d}" fill="none" style="stroke:${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.6" style="fill:${color}"/></svg>`;
}

const legendHtml = (items) => `<ul class="key">${items.map((i) => `<li><span class="sw" style="background:${i.color}"></span>${esc(i.label)}</li>`).join('')}</ul>`;

/* ---------- overview: the dashboard ---------- */
function heatCal(D, m) {
  const [y, mo] = m.split('-').map(Number), days = daysIn(m), lead = (new Date(y, mo - 1, 1).getDay() + 6) % 7;
  const by = Array(days + 1).fill(0);
  D.inMonth(m, 'expense').forEach((t) => { by[Number(t.date.slice(8))] += t.amount; });
  const mx = Math.max(...by, 1), today = isPartial(m) ? nowDate().getDate() : m > curMonth() ? 0 : days;
  const noSpend = by.slice(1, today + 1).filter((v) => v === 0).length;
  let cells = ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map((d) => `<span class="hd">${d}</span>`).join('') + '<span></span>'.repeat(lead);
  for (let d = 1; d <= days; d += 1) {
    const v = by[d], p = v ? Math.round(18 + (v / mx) * 62) : 0;
    cells += `<span class="hc${v ? ' on' : ''}${p >= 55 ? ' hot' : ''}${d > today ? ' fut' : ''}" style="--p:${p}%" title="${d} ${monthName(m, true)}: ${v ? money(v) : 'no spending'}">${d}</span>`;
  }
  const peak = mx > 1 || by.some((v) => v > 0) ? by.indexOf(Math.max(...by)) : 0;
  const note = peak ? `Biggest day: ${peak} ${monthName(m, true)}, ${money(by[peak])}. ${noSpend} day${noSpend === 1 ? '' : 's'} with no spending.` : 'No spending recorded yet.';
  return `<div class="heat">${cells}</div><p class="muted">${note}</p>`;
}

  <section class="section"><h2>Spending calendar</h2>${heatCal(D, m)}</section></div>`;

  <section class="section"><div class="section-head"><h2>Suggestions for you</h2><a class="link" href="#assistant">Open assistant</a></div>${A.available && A.insights.length ? InsightList(A.insights.slice(0, 4)) : Empty('No suggestions yet', 'Add a few weeks of expenses and they will appear here.')}</section></div>`;

  return html;

/* ---------- transactions ---------- */

}
function viewTransactions() {

  if (!rows.length) return html + Empty(f.all ? 'No transactions match' : `No transactions in ${monthName(ui.month)}`, 'Add one with the button above, or change the filters.');
  html += `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Spent on</th><th>Entered at</th><th>Description</th><th>Category</th><th class="r">Amount</th><th></th></tr></thead><tbody>${rows.map((t) => `<tr><td>${dateLabel(t.date)}</td><td class="stamp">${esc(stampLabel(t.addedAt))}</td><td>${t.description ? esc(t.description) : '<span class="muted">No description</span>'}</td><td>${Dot(t.category)} ${esc(t.category)}${t.source === 'ai' ? '<span class="tag">auto</span>' : ''}</td><td class="r amount ${t.type}">${t.type === 'income' ? '+' : '-'}${money(t.amount)}</td><td class="acts"><button type="button" class="link" data-act="edit-tx" data-id="${t.id}">Edit</button><button type="button" class="link danger" data-act="del-tx" data-id="${t.id}">Delete</button></td></tr>`).join('')}</tbody></table></div>
  <div class="pager"><span>${all.length} transaction${all.length === 1 ? '' : 's'}</span><div><button type="button" class="btn small" data-act="prev-page" ${ui.page <= 1 ? 'disabled' : ''}>Previous</button> <span>Page ${ui.page} of ${pages}</span> <button type="button" class="btn small" data-act="next-page" ${ui.page >= pages ? 'disabled' : ''}>Next</button></div></div>`;

function bindTransactions() {

  $('#f-cat').onchange = (e) => { ui.filters.category = e.target.value; rerender(); };

function txModal(id) {
  if (!canWrite()) return;
  const t = id ? state.tx.find((x) => x.id === id) : null;
  const today = isoDate(nowDate()), defDate = ui.month === today.slice(0, 7) ? today : `${ui.month}-01`, type = t ? t.type : 'expense';
  $('#modal').innerHTML = `<div class="overlay" data-act="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-label="${t ? 'Edit' : 'Add'} transaction"><div class="dialog-head"><h2>${t ? 'Edit' : 'Add'} transaction</h2><button type="button" class="link" data-act="close-modal">Close</button></div>
  <form id="tx-form" class="stack" novalidate>
    <div class="seg" role="group" aria-label="Type"><button type="button" data-type="expense" class="${type === 'expense' ? 'on' : ''}" aria-pressed="${type === 'expense'}">Expense</button><button type="button" data-type="income" class="${type === 'income' ? 'on' : ''}" aria-pressed="${type === 'income'}">Income</button></div>
    <div class="row"><div class="field"><label for="tx-amount">Amount (₹)</label><input id="tx-amount" type="number" min="0.01" step="0.01" value="${t ? t.amount : ''}" required></div><div class="field"><label for="tx-date">Date</label><input id="tx-date" type="date" value="${t ? t.date : defDate}" required></div></div>
    <div class="field"><label for="tx-desc">Description</label><input id="tx-desc" maxlength="200" value="${esc(t ? t.description : '')}" placeholder="For example, Swiggy dinner"></div>
    <div class="field"><label for="tx-cat">Category</label><select id="tx-cat" required></select><small class="hint" id="tx-hint"></small></div>
    <p class="muted small" id="tx-stamp">${t ? `Entered at ${esc(stampLabel(t.addedAt))}${t.editedAt ? `. Last changed ${esc(stampLabel(t.editedAt))}` : ''}.` : 'The date and time of entry are recorded automatically when you save.'}</p>
    <p class="err" id="tx-err" role="alert" hidden></p>
    <div class="dialog-actions"><button type="button" class="btn" data-act="close-modal">Cancel</button><button class="btn primary" type="submit">Save transaction</button></div></form></div></div>`;
  const form = $('#tx-form');
  let curType = type, suggestion = null, touched = Boolean(t), aiUsed = Boolean(t && t.source === 'ai'), lastAsked = '';
  const fillCats = (sel) => { $('#tx-cat').innerHTML = '<option value="">Choose a category</option>' + (curType === 'income' ? INCOME : EXPENSE).map((c) => `<option ${c === sel ? 'selected' : ''}>${c}</option>`).join(''); };
  fillCats(t ? t.category : '');
  const hint = () => {
    const h = $('#tx-hint');
    if (!suggestion || curType !== 'expense') { h.innerHTML = ''; return; }
    h.innerHTML = `${suggestion.lowConfidence ? 'Not sure about this one. Best guess: ' : 'Suggested: '}<strong>${esc(suggestion.category)}</strong> (${Math.round(suggestion.confidence * 100)}% sure)` + ($('#tx-cat').value !== suggestion.category ? ' <button type="button" class="link" id="use-sug">Use it</button>' : '');
    const b = $('#use-sug'); if (b) b.onclick = () => { $('#tx-cat').value = suggestion.category; aiUsed = true; touched = true; hint(); };
  };
  $$('.seg button', form).forEach((b) => b.onclick = () => {
    curType = b.dataset.type; suggestion = null; aiUsed = false; touched = false;
    $$('.seg button', form).forEach((x) => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b); });
    fillCats(''); hint();
  });
  $('#tx-desc').onblur = () => {
    const text = $('#tx-desc').value.trim();
    if (curType !== 'expense' || text.length < 3 || text === lastAsked) return;
    lastAsked = text; suggestion = categorize(text, aiExamples());
    if (!touched && !$('#tx-cat').value && !suggestion.lowConfidence) { $('#tx-cat').value = suggestion.category; aiUsed = true; }
    hint();
  };
  $('#tx-cat').onchange = () => { touched = true; aiUsed = false; hint(); };
  form.onsubmit = (e) => {
    e.preventDefault();
    const err = $('#tx-err'), amount = Number($('#tx-amount').value), category = $('#tx-cat').value, date = $('#tx-date').value;
    const fail = (msg) => { err.textContent = msg; err.hidden = false; };
    if (!(amount > 0)) return fail('Enter an amount greater than 0.');
    if (!date) return fail('Choose a date.');
    if (!category) return fail('Choose a category.');
    const rec = { type: curType, amount, category, description: $('#tx-desc').value.trim().slice(0, 200), date, source: aiUsed && suggestion && suggestion.category === category ? 'ai' : 'manual' };
    const months = new Set([date.slice(0, 7)]);
    const stampNow = new Date().toISOString();
    if (t) { months.add(t.date.slice(0, 7)); Object.assign(t, rec); t.editedAt = stampNow; if (!t.addedAt) t.addedAt = stampNow; } else state.tx.push({ id: uid(), ...rec, addedAt: stampNow });
    persist({ months: [...months] }); closeModal(); render();
  };
  $('#tx-amount').focus();
}

function afterBudget() {

    const stamp = new Date().toISOString(), prev = state.budgets[ui.month];
    state.budgets[ui.month] = { totalLimit: total, categoryLimits: limits, setAt: (prev && prev.setAt) || stamp, updatedAt: stamp }; persist({ budgets: [ui.month] }); render();
    const ok = $('#b-ok'); if (ok) { ok.textContent = 'Budget saved.'; ok.hidden = false; }
  };
}

/* ---------- goals ---------- */
function goalCalc(g) {
  const percent = g.targetAmount > 0 ? Math.min(100, (g.savedAmount / g.targetAmount) * 100) : 0;
  let monthly = null;
  if (g.deadline && g.savedAmount < g.targetAmount) {
    const left = (new Date(g.deadline + 'T00:00:00') - nowDate()) / (1000 * 60 * 60 * 24 * 30.44);
    monthly = left > 0 ? Math.ceil((g.targetAmount - g.savedAmount) / Math.max(left, 1)) : g.targetAmount - g.savedAmount;
  }
  return { percent: Math.round(percent * 10) / 10, monthly, done: percent >= 100 };
}

  };
  if (!restore) return;
  const twice = (btn, again, run) => { btn.onclick = () => { if (btn.dataset.sure) { run(); return; } btn.dataset.sure = '1'; btn.textContent = again; }; };
  $('#tm-restore').onclick = async () => {

  $('#modal').innerHTML = `<div class="overlay" data-act="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-label="Your data and privacy"><div class="dialog-head"><h2>Your data and privacy</h2><button type="button" class="link" data-act="close-modal">Close</button></div><div class="stack">
    <p class="callout">${esc(privacy)}</p>
    <div class="field"><span class="muted">Where your records are saved</span><div class="seg" role="group" aria-label="Where your records are saved"><button type="button" data-loc="cloud" class="${cloudOn ? 'on' : ''}" aria-pressed="${cloudOn}" ${store.cloudOk ? '' : 'disabled'}>Private account space</button><button type="button" data-loc="local" class="${cloudOn ? '' : 'on'}" aria-pressed="${!cloudOn}">This computer (browser)</button></div><small>Browser storage is not a file you can open. For a real file on your computer, use Save backup file below.</small></div>
    <div class="field"><span class="muted">Files on this computer</span><div class="page-actions"><button type="button" class="btn" id="tm-file">Save backup file</button><button type="button" class="btn" id="tm-csvfile">Save transactions as CSV</button><label class="btn" for="tm-open">Open a backup file</label><input id="tm-open" type="file" accept=".json,application/json,text/plain" hidden></div></div>
    <label class="muted" for="tm-text">Backup text (the same content as the backup file)</label><textarea id="tm-text" class="mono" spellcheck="false">${esc(JSON.stringify(state))}</textarea>
    <p class="ok" id="tm-msg" role="status" hidden></p><p class="err" id="tm-err" role="alert" hidden></p>
    <div class="dialog-actions"><button type="button" class="btn" id="tm-restore">Restore from this text</button><button type="button" class="btn primary" id="tm-copy">Copy</button></div>
    <hr><div class="page-actions"><button type="button" class="btn" id="tm-sample">Replace with sample data</button><button type="button" class="btn" id="tm-clear">Delete all my data</button></div></div></div></div>`;
  const msg = (t, bad) => { $('#tm-err').hidden = true; $('#tm-msg').hidden = true; const el = $(bad ? '#tm-err' : '#tm-msg'); el.textContent = t; el.hidden = false; };
  $$('[data-loc]').forEach((b) => b.onclick = () => { if ((b.dataset.loc === 'cloud') !== cloudOn) setLocation(b.dataset.loc); });
  $('#tm-file').onclick = () => saveFile(`paisa-pilot-backup-${isoDate(nowDate())}.json`, JSON.stringify(state, null, 1));
  $('#tm-csvfile').onclick = () => saveFile('paisa-pilot-transactions.csv', csvOf(state.tx.slice().sort((a, b) => (a.date < b.date ? 1 : -1))));
  $('#tm-open').onchange = (e) => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { $('#tm-text').value = String(r.result); msg('File loaded into the box. Press Restore to replace your records with it.'); };
    r.onerror = () => msg('That file could not be read.', true);
    r.readAsText(f);
  };
  $('#tm-copy').onclick = () => {
    const ta = $('#tm-text'), fallback = () => { ta.focus(); ta.select(); msg('Text selected. Press Ctrl+C (or Cmd+C) to copy it.'); };
    try { navigator.clipboard.writeText(ta.value).then(() => msg('Copied.'), fallback); } catch (e) { fallback(); }
  };
  const twice = (btn, again, run) => { btn.onclick = () => { if (btn.dataset.sure) { run(); return; } btn.dataset.sure = '1'; btn.textContent = again; }; };
  $('#tm-restore').onclick = async () => {
    let next;
    try { next = parseBackup($('#tm-text').value); } catch (e) { msg('That is not a valid backup. Paste the full backup text or open the backup file.', true); return; }
    if (await replaceAll(next)) { closeModal(); setNotice('Backup restored.'); render(); }
  };
  twice($('#tm-sample'), 'Press again to replace your data', async () => { if (await replaceAll(sampleData())) { closeModal(); setNotice('Sample data loaded.'); render(); } });
  twice($('#tm-clear'), 'Press again to delete everything', async () => { if (await replaceAll({ tx: [], budgets: {}, goals: [] })) { closeModal(); setNotice('All data deleted.'); render(); } });
}

/* ---------- router and shell ---------- */
const VIEW_FN = { overview: [viewOverview, afterOverview], transactions: [viewTransactions, bindTransactions], budget: [viewBudget, afterBudget], analytics: [viewAnalytics, afterAnalytics], assistant: [viewAssistant, afterAssistant], goals: [viewGoals, afterGoals], reports: [viewReports, afterReports] };
function loadingView() {
  if (store.error === 'revoked') return PageHead('Overview') + Empty('Access to your saved data was withdrawn', 'Reload the page. If this keeps happening, ask the owner to check your sharing level.');
  if (store.slow || store.error) return PageHead('Overview') + `<section class="section"><h2>Can't reach your saved data yet</h2><p class="muted">Your private space is not answering. You can keep waiting, or work in this browser only for now (changes made that way will not sync to your account).</p><div class="page-actions"><button type="button" class="btn primary" data-act="go-local">Use this browser only</button></div></section>`;
  return PageHead('Overview') + '<p class="loading">Opening your private space...</p>';
}
function render() {
  paintStatus();
  mounts = [];
  $('#nav').innerHTML = VIEWS.map(([k, l]) => `<a href="#${k}" ${k === ui.view ? 'aria-current="page"' : ''}>${l}</a>`).join('');
  $('#monthLabel').textContent = monthName(ui.month);
  $('#nextM').disabled = ui.month >= curMonth();
  $('#thisM').hidden = ui.month === curMonth();
  if (store.mode === 'connecting' || (store.mode === 'cloud' && !store.ready)) { $('#view').innerHTML = loadingView(); return; }
  const [view, after] = VIEW_FN[ui.view];
  store.sig = sigOf(); store.dirty = false;
  $('#view').innerHTML = view();
  if (after) after();
  paintCharts();
}
function route() {
  const h = location.hash.replace('#', '');
  ui.view = VIEW_FN[h] ? h : 'overview';
  closeModal(); render(); window.scrollTo(0, 0);
}

document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const twice = (label, run) => {
    if (el.dataset.sure) { run(); return; }
    const orig = el.textContent; el.dataset.sure = '1'; el.textContent = label;
    setTimeout(() => { if (el.isConnected) { delete el.dataset.sure; el.textContent = orig; } }, 3500);
  };
  if (act === 'overlay') { if (e.target === el) closeModal(); return; }
  if (act === 'close-modal') closeModal();
  else if (act === 'add-tx') txModal();
  else if (act === 'edit-tx') txModal(el.dataset.id);
  else if (act === 'del-tx') twice('Click again to delete', () => {
    if (!canWrite()) return;
    const t = state.tx.find((x) => x.id === el.dataset.id); if (!t) return;
    state.tx = state.tx.filter((x) => x.id !== t.id); persist({ months: [t.date.slice(0, 7)] }); render();
  });
  else if (act === 'del-goal') twice('Click again to delete', () => { if (!canWrite()) return; state.goals = state.goals.filter((g) => g.id !== el.dataset.id); persist({ goals: true }); render(); });
  else if (act === 'del-budget') twice('Click again to remove', () => { if (!canWrite()) return; delete state.budgets[ui.month]; persist({ budgets: [ui.month] }); render(); });
  else if (act === 'prev-page') { ui.page -= 1; render(); }
  else if (act === 'next-page') { ui.page += 1; render(); }
  else if (act === 'suggest-budget') suggestBudget();
  else if (act === 'show-csv') showCsv();
  else if (act === 'pdf') savePdf();
  else if (act === 'dismiss-notice') { ui.notice = null; if (store.importDismissed === undefined) store.importDismissed = true; render(); }
  else if (act === 'go-local') startLocal();
  else if (act === 'load-sample') { if (await replaceAll(sampleData())) { closeModal(); setNotice('Sample data loaded. It covers six months so every page has something to show. Delete it any time from Your data and privacy.'); location.hash = '#overview'; render(); } }
  else if (act === 'import-local') {
    const local = readLocal();
    if (local && await replaceAll(local)) { try { localStorage.removeItem(LOCAL_KEY); } catch (err) { /* ignore */ } setNotice('Moved your browser records into your private space.'); render(); }
  }
});
$('#prevM').onclick = () => { ui.month = addMonths(ui.month, -1); ui.page = 1; render(); };
$('#nextM').onclick = () => { if (ui.month < curMonth()) { ui.month = addMonths(ui.month, 1); ui.page = 1; render(); } };
$('#thisM').onclick = () => { ui.month = curMonth(); ui.page = 1; render(); };
$('#goBackup').onclick = showBackup;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
window.addEventListener('hashchange', route);
try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render()); } catch (e) { /* older browsers */ }

route();
initStorage();
</script>

</body></html>
